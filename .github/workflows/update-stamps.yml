name: スタンプリスト自動更新

on:
  schedule:
    - cron: "0 18 * * 0"  # 毎週月曜日 午前3時（日本時間）
  workflow_dispatch:        # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: スクレイピング実行
        run: python scraper/scrape.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stamps.json
          git diff --staged --quiet || git commit -m "🎴 スタンプリストを自動更新 $(date '+%Y-%m-%d')"
          git push
